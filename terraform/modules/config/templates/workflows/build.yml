name: Build and publish

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to build
        required: true
        default: main
        type: string
      tests_only:
        description: Run the test suite only; do not build or publish an image
        required: false
        default: false
        type: boolean
      deploy_to:
        description: Deploy the published image to this environment; select none to skip
        required: false
        default: none
        type: choice
        options:
          - none
          - beta
          - prd

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Run service tests
        run: |
          TEST_SCRIPT=".github/scripts/test.sh"
          if [ ! -f "${TEST_SCRIPT}" ]; then
            echo "::error::Missing ${TEST_SCRIPT}. Add the service-specific test script."
            exit 1
          fi
          bash "${TEST_SCRIPT}"

  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.tests_only }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          BRANCH_TAG=$(echo "${BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g')

          TIMESTAMP=$(TZ=Europe/Rome date '+%d-%m-%Y_%H-%M')

          echo "tag=${BRANCH_TAG}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -t "${ECR_REPO_URL}:${IMAGE_TAG}" \
            .

      - name: Push Docker image
        env:
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push \
            "${ECR_REPO_URL}:${IMAGE_TAG}"

      - name: Summary
        env:
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "Image published:"
          echo "${ECR_REPO_URL}:${IMAGE_TAG}"

  deploy:
    name: Deploy published image
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.tests_only && inputs.deploy_to != 'none' }}

    steps:
      - name: Dispatch deployment workflow
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          INFRA_REPO_FULL_NAME: ${{ secrets.INFRA_REPO_FULL_NAME }}
          DEPLOY_WORKFLOW: ${{ secrets.DEPLOY_WORKFLOW }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          TO_ENVIRONMENT: ${{ inputs.deploy_to }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          [ -n "${INFRA_REPO_TOKEN}" ] || { echo "Missing INFRA_REPO_TOKEN" >&2; exit 1; }
          [ -n "${INFRA_REPO_FULL_NAME}" ] || { echo "Missing INFRA_REPO_FULL_NAME" >&2; exit 1; }
          [ -n "${DEPLOY_WORKFLOW}" ] || { echo "Missing DEPLOY_WORKFLOW" >&2; exit 1; }
          [ -n "${DEPLOY_SERVICE}" ] || { echo "Missing DEPLOY_SERVICE" >&2; exit 1; }
          [ -n "${IMAGE_TAG}" ] || { echo "Missing image tag from build" >&2; exit 1; }

          PAYLOAD=$(jq -n \
            --arg ref "main" \
            --arg service "${DEPLOY_SERVICE}" \
            --arg to_environment "${TO_ENVIRONMENT}" \
            --arg image_tag "${IMAGE_TAG}" \
            '{ref: $ref, inputs: {service: $service, to_environment: $to_environment, image_tag: $image_tag, dry_run: "false"}}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${INFRA_REPO_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "https://api.github.com/repos/${INFRA_REPO_FULL_NAME}/actions/workflows/${DEPLOY_WORKFLOW}/dispatches"
