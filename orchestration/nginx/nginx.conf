events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Cache delle GET pubbliche di /api/
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=50m inactive=10m use_temp_path=off;

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name DOMINIO www.DOMINIO;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name DOMINIO www.DOMINIO;

        ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        set $frontend_upstream http://frontend:80;
        set $api_upstream      http://api:8000;

        location = /diagram/architecture.json {
            alias /usr/share/nginx/diagram/architecture.json;
            default_type application/json;
            add_header Cache-Control "public, max-age=300";
        }

        # Frontend Angular (SPA)
        location / {
            proxy_pass         $frontend_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Backend API Django
        location /api/ {
            rewrite            ^/api/(.*)$ /$1 break;
            proxy_pass         $api_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Accept-Encoding "";
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            proxy_cache            api_cache;
            proxy_cache_key        "$request_method$host$request_uri$http_accept_language";
            proxy_cache_valid      200 60s;
            proxy_cache_lock       on;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_bypass     $http_authorization $cookie_sessionid;
            proxy_no_cache         $http_authorization $cookie_sessionid;
            add_header             X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 443 ssl;
        server_name admin.DOMINIO;

        ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        set $admin_upstream http://admin:80;
        set $api_upstream   http://api:8000;

        location / {
            proxy_pass         $admin_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            rewrite            ^/api/(.*)$ /$1 break;
            proxy_pass         $api_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana.DOMINIO;

        ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        set $grafana_upstream http://grafana:3000;

        location / {
            proxy_pass         $grafana_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/live/ {
            proxy_pass         $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
        }
    }
}