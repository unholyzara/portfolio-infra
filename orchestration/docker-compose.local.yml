name: portfolio
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - ./diagram:/usr/share/nginx/diagram:ro
    depends_on:
      - api
      - frontend
      - admin

  frontend:
    build:
      context: ../../portfolio-frontend
    depends_on:
      - api

  admin:
    build:
      context: ../../portfolio-admin
    depends_on:
      - api

  api:
    build:
      context: ../../portfolio-api
    env_file:
      - ../services/api/envs/${ENVIRONMENT}.env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../services/postgres/envs/${ENVIRONMENT}.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "6543:5432"

volumes:
  postgres-data:
  certbot-certs:
