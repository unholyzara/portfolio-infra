name: portfolio
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./diagram:/usr/share/nginx/diagram:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api
      - admin

  frontend:
    image: ${ECR_REGISTRY}/portfolio-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-32m}
    env_file:
      - ./services/frontend/${ENVIRONMENT}.env
    depends_on:
      - api

  admin:
    image: ${ECR_REGISTRY}/portfolio-admin:${ADMIN_TAG}
    restart: unless-stopped
    mem_limit: ${ADMIN_MEM_LIMIT:-32m}
    env_file:
      - ./services/admin/${ENVIRONMENT}.env
    depends_on:
      - api

  api:
    image: ${ECR_REGISTRY}/portfolio-api:${API_TAG}
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-256m}
    env_file:
      - ./services/api/${ENVIRONMENT}.env
    environment:
      WEB_CONCURRENCY: ${API_WORKERS:-1}
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-192m}
    command: [ "postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-48MB}", "-c", "max_connections=30" ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-192m}
    profiles:
      - monitoring
    env_file:
      - ./services/grafana/${ENVIRONMENT}.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  grafana-data:
  certbot-certs:

x-lambdas:
  backup:
    profiles: [ backup ]
    x-repository-info:
      type: lambda
      repo_description: "Portfolio Backup lambda"
      visibility: public
    x-diagram:
      kind: lambda
      stack: Backup su S3
      calls: [ postgres ]
    x-backup: true
    x-schedule: 0 0 * * ? *
