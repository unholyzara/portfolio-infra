name: portfolio
x-environments:
  - name: beta
  - name: prd
x-shared-secrets:
  secret-key:
    value:
      length: 32
      special: false
      override_special: null
  grafana-password:
    value:
      length: 64
      special: true
      override_special: "-_=+.,~"
  db-user:
    value:
  db-password:
    value:
      length: 64
      special: true
      override_special: "-_=+.,~"
  db-name:
    value:
  api-db-user:
    value:
  api-db-password:
    value:
      length: 64
      special: true
      override_special: "-_=+.,~"
  backup-db-user:
    value:
  backup-db-password:
    value:
      length: 64
      special: true
      override_special: "-_=+.,~"
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./diagram:/usr/share/nginx/diagram:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api
      - admin
    x-repository-info:
      deployable: false
    x-subdomain: null
    x-diagram:
      kind: platform
      stack: reverse proxy

  frontend:
    image: ${ECR_REGISTRY}/portfolio-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-32m}
    env_file:
      - ./services/frontend/${ENVIRONMENT}.env
    depends_on:
      - api
    x-repository-info:
      type: frontend
      repo_description: "Portfolio frontend — Angular"
      deployable: true
      visibility: public
    x-subdomain: null
    x-diagram:
      kind: frontend
      stack: Angular
      public: [ DOMINIO ]
      uses: [ ECR ]

  admin:
    image: ${ECR_REGISTRY}/portfolio-admin:${ADMIN_TAG}
    restart: unless-stopped
    mem_limit: ${ADMIN_MEM_LIMIT:-32m}
    env_file:
      - ./services/admin/${ENVIRONMENT}.env
    depends_on:
      - api
    x-repository-info:
      type: admin
      repo_description: "Portfolio admin — React backoffice"
      deployable: true
      visibility: public
    x-subdomain: admin
    x-diagram:
      kind: frontend
      stack: React
      public: [ admin.DOMINIO ]
      uses: [ ECR ]

  api:
    image: ${ECR_REGISTRY}/portfolio-api:${API_TAG}
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-256m}
    env_file:
      - ./services/api/${ENVIRONMENT}.env
    environment:
      WEB_CONCURRENCY: ${API_WORKERS:-1}
      SECRET_KEY: ${SECRET_KEY}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    x-repository-info:
      type: backend
      repo_description: "Portfolio API service — Django"
      deployable: true
      visibility: public
    x-subdomain: null
    x-shared-secrets:
      secret-key:
        env-var: SECRET_KEY
      api-db-user:
        env-var: DB_USER
      api-db-password:
        env-var: DB_PASSWORD
      db-name:
        env-var: DB_NAME
    x-diagram:
      kind: backend
      stack: Django + DRF
      public: [ DOMINIO/api, admin.DOMINIO/api ]
      calls: [ postgres ]
      uses: [ ECR, SSM ]

  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-192m}
    command: [ "postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-48MB}", "-c", "max_connections=30" ]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - API_DB_PASSWORD=${API_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 30
    x-repository-info:
      deployable: false
    x-subdomain: null
    x-diagram:
      kind: database
      stack: PostgreSQL 16

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-192m}
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    env_file:
      - ./services/grafana/${ENVIRONMENT}.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    x-repository-info:
      deployable: false
    x-subdomain: grafana
    x-diagram:
      kind: monitoring
      stack: Grafana
      public: [ grafana.DOMINIO ]

volumes:
  postgres-data:
  grafana-data:
  certbot-certs:

x-lambdas:
  backup:
    profiles: [ backup ]
    env_file:
      - ./env/backup/prd.env
    x-repository-info:
      type: lambda
      repo_description: "Portfolio Backup lambda"
      visibility: public
    x-diagram:
      kind: lambda
      stack: Backup su S3
      calls: [ postgres ]
    x-backup: true
    x-schedule: 0 0 * * ? *

x-platform:
  nodes:
    browser: { label: Browser, kind: client }
    route53: { label: Route 53, stack: DNS, kind: aws }
    s3_backup: { label: S3, stack: backup bucket, kind: aws }
    cloudwatch: { label: CloudWatch, stack: metrics, kind: aws }
  edges:
    - [ browser, nginx, HTTPS ]
    - [ browser, route53, DNS ]
    - [ backup, s3_backup, dump ]
    - [ grafana, cloudwatch, metrics ]
