name: portfolio
x-environments:
  - name: beta
  - name: prd
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./diagram:/usr/share/nginx/diagram:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api
    x-repository-info:
      deployable: false
    x-subdomain: null
    x-diagram:
      kind: platform
      stack: reverse proxy

  frontend:
    image: ${ECR_REGISTRY}/portfolio-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    x-repository-info:
      type: frontend
      repo_description: "Portfolio frontend — Angular"
      deployable: true
      visibility: public
    x-subdomain: null
    x-diagram:
      kind: frontend
      stack: Angular
      public: [ DOMAIN ]

  admin:
    image: ${ECR_REGISTRY}/portfolio-admin:${ADMIN_TAG}
    restart: unless-stopped
    env_file:
      - ./services/admin/${ENVIRONMENT}.env
    x-repository-info:
      type: admin
      repo_description: "Portfolio admin — React backoffice"
      deployable: true
      visibility: public
    x-subdomain: admin
    x-diagram:
      kind: frontend
      stack: React
      public: [ admin.DOMAIN ]

  api:
    image: ${ECR_REGISTRY}/portfolio-api:${API_TAG}
    restart: unless-stopped
    env_file:
      - ./services/api/${ENVIRONMENT}.env
    depends_on:
      - postgres
    x-repository-info:
      type: backend
      repo_description: "Portfolio API service — Django"
      deployable: true
      visibility: public
    x-subdomain: null
    x-diagram:
      kind: backend
      stack: Django + DRF
      public: [ DOMAIN/api, admin.DOMAIN/api ]
      calls: [ postgres ]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD}
      - API_DB_PASSWORD=${API_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 30
    x-repository-info:
      deployable: false
    x-subdomain: null
    x-diagram:
      kind: database
      stack: PostgreSQL 16

  backup:
    build: ./extra_services/backup
    profiles: [ backup ]
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./env/backup/prd.env
    environment:
      PGPASSWORD: ${API_DB_PASSWORD}
    x-repository-info:
      deployable: false
    x-subdomain: null
    x-diagram:
      kind: job
      stack: Backup su S3
      calls: [ postgres ]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.DOMAIN
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    x-repository-info:
      deployable: false
    x-subdomain: grafana
    x-diagram:
      kind: monitoring
      stack: Grafana
      public: [ grafana.DOMAIN ]

volumes:
  postgres-data:
  grafana-data:
  certbot-certs:

x-platform:
  nodes:
    route53:
      label: Route 53
      group: edge
      terraform: aws_route53_record
    ecr:
      label: ECR
      group: config
      terraform: aws_ecr_repository
    ssm:
      label: SSM Parameter Store
      group: config
      terraform: aws_ssm_parameter
    s3_backup:
      label: S3 backup
      group: data
      terraform: aws_s3_bucket
    cloudwatch:
      label: CloudWatch
      group: ops
  edges:
    - [ route53, nginx, DNS ]
    - [ ecr, frontend, image pull ]
    - [ ecr, admin, image pull ]
    - [ ecr, api, image pull ]
    - [ ssm, api, secrets al boot ]
    - [ backup, s3_backup, dump ]
    - [ grafana, cloudwatch, metriche ]
