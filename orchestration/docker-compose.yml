name: portfolio
x-environments:
  - name: beta
  - name: prd
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - admin
    x-repository-info:
      deployable: false

  frontend:
    image: ${ECR_REGISTRY}/portfolio-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    x-repository-info:
      type: frontend
      repo_description: "Portfolio frontend — Angular"
      deployable: true
      visibility: public

  admin:
    image: ${ECR_REGISTRY}/portfolio-admin:${ADMIN_TAG}
    restart: unless-stopped
    env_file:
      - ./services/admin/${ENVIRONMENT}.env
    x-repository-info:
      type: admin
      repo_description: "Portfolio admin — Django backoffice"
      deployable: true
      visibility: public

  api:
    image: ${ECR_REGISTRY}/portfolio-api:${API_TAG}
    restart: unless-stopped
    env_file:
      - ./services/api/${ENVIRONMENT}.env
    depends_on:
      - postgres
    x-repository-info:
      type: backend
      repo_description: "Portfolio API service — Django"
      deployable: true
      visibility: public

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD}
      - API_DB_PASSWORD=${API_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 30
    x-repository-info:
      deployable: false

  backup:
    build: ./extra_services/backup
    profiles: [ backup ]
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./env/backup/prd.env
    environment:
      PGPASSWORD: ${API_DB_PASSWORD}
    x-repository-info:
      deployable: false

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.admin.unholyzara.dev
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    x-repository-info:
      deployable: false

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    x-repository-info:
      deployable: false

volumes:
  postgres-data:
  grafana-data:
  portainer-data:
  certbot-certs:
