    ecr: true
    deployable: true
    visibility: public

  - name: persona
    type: backend
    repo_description: "Portfolio Persona service — Django"
    ecr: true
    deployable: true
    visibility: public

  - name: projects
    type: backend
    repo_description: "Portfolio Projects service — Django"
    ecr: true
    deployable: true
    visibility: public

  - name: cv
    type: backend
    repo_description: "Portfolio CV service — Django"
    ecr: true
    deployable: true
    visibility: public

  - name: orchestrator
    type: orchestrator
    repo_description: "Portfolio orchestrator — Docker Compose, nginx, scripts for EC2 and local development"
