name: Deploy orchestration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [beta, prd]
        required: true
      dry_run:
        description: "Dry run"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-1

      - name: Find EC2 instance
        id: ec2
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=portfolio-${ENVIRONMENT}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          [ -n "${INSTANCE_IDS}" ] && [ "${INSTANCE_IDS}" != "None" ] || {
            echo "No running EC2 instance found for ${ENVIRONMENT}" >&2
            exit 1
          }
          read -r -a INSTANCE_ID_LIST <<< "${INSTANCE_IDS}"
          [ "${#INSTANCE_ID_LIST[@]}" -eq 1 ] || {
            echo "Expected exactly one running EC2 instance for ${ENVIRONMENT}, found ${#INSTANCE_ID_LIST[@]}" >&2
            exit 1
          }
          echo "instance_id=${INSTANCE_ID_LIST[0]}" >> "$GITHUB_OUTPUT"

      - name: Start or refresh Docker Compose
        if: ${{ !inputs.dry_run }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          COMMANDS=$(ENVIRONMENT="${ENVIRONMENT}" python3 - <<'PY'
          import json
          import os

          env = os.environ["ENVIRONMENT"]
          root = "/home/deploy/app/orchestration"
          ready = "for i in $(seq 1 120); do [ -f /home/deploy/app/orchestration/.env ] && [ \"$(stat -c %U /home/deploy/app/orchestration/.env)\" = deploy ] && systemctl is-active --quiet docker && break; sleep 5; done; [ -f /home/deploy/app/orchestration/.env ] && [ \"$(stat -c %U /home/deploy/app/orchestration/.env)\" = deploy ] && systemctl is-active --quiet docker || { echo \"EC2 bootstrap did not finish\" >&2; exit 1; }"
          profile = " --profile monitoring" if env == "prd" else ""
          deploy = f'''set -e
          cd {root}
          override=$(sudo -u deploy mktemp)
          trap 'rm -f "$override"' EXIT
          set -- -f {root}/docker-compose.yml
          for file in /home/deploy/app/services/*/compose.yml; do
            [ -f "$file" ] || continue
            set -- "$@" -f "$file"
          done
          sudo -u deploy python3 {root}/scripts/helpers/deploy-orchestration/deploy_orchestration.py {env} "$override"
          sudo -u deploy docker compose "$@" -f "$override"{profile} pull
          sudo -u deploy docker compose "$@" -f "$override"{profile} up -d'''
          print(json.dumps({"commands": [ready, "sudo -u deploy git -C /home/deploy/app pull --ff-only origin main", deploy]}))
          PY
          )
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${COMMANDS}" \
            --comment "Deploy Docker Compose to ${ENVIRONMENT}" \
            --query "Command.CommandId" \
            --output text)

          STATUS="Pending"
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac
            sleep 5
          done
          [ "${STATUS}" = "Success" ] || { echo "Timed out waiting for command" >&2; exit 1; }

      - name: Summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Deploy orchestration"
            echo "- environment: \`${ENVIRONMENT}\`"
            echo "- instance: \`${INSTANCE_ID}\`"
            echo "- dry run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
