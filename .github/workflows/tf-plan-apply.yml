name: Terraform prd

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        type: choice
        options: [plan, apply]
        default: plan
        required: true

jobs:
  terragrunt:
    name: Terragrunt ${{ inputs.action }} prd
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: eu-south-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Setup Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.0/terragrunt_linux_amd64 \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Terragrunt plan
        working-directory: environments/prd/
        env:
          TF_VAR_admin_ip:       ${{ secrets.ADMIN_IP }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ecr_registry:   ${{ vars.ECR_REGISTRY }}
        run: terragrunt plan -out=tfplan

      - name: Terragrunt apply
        if: inputs.action == 'apply'
        working-directory: environments/prd/
        env:
          TF_VAR_admin_ip:       ${{ secrets.ADMIN_IP }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ecr_registry:   ${{ vars.ECR_REGISTRY }}
        run: terragrunt apply tfplan
