name: Deploy service

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service name"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: choice
        options: [beta, prd]
        required: true
      image_tag:
        description: "Image tag to deploy (e.g. main-abc1234)"
        type: string
        required: true
      dry_run:
        description: "Dry run"
        type: boolean
        default: true
      run_migrations:
        description: "Run database migrations before starting the container"
        type: boolean
        default: false
  repository_dispatch:
    types: [deploy-service]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout portfolio-infra
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ github.event.client_payload.service }}
          DISPATCH_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          DISPATCH_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          DISPATCH_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          DISPATCH_RUN_MIGRATIONS: ${{ github.event.client_payload.run_migrations }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            SERVICE="${DISPATCH_SERVICE}"
            ENVIRONMENT="${DISPATCH_ENVIRONMENT}"
            IMAGE_TAG="${DISPATCH_IMAGE_TAG}"
            DRY_RUN="${DISPATCH_DRY_RUN:-false}"
            RUN_MIGRATIONS="${DISPATCH_RUN_MIGRATIONS}"
          else
            SERVICE="${INPUT_SERVICE}"
            ENVIRONMENT="${INPUT_ENVIRONMENT}"
            IMAGE_TAG="${INPUT_IMAGE_TAG}"
            DRY_RUN="${INPUT_DRY_RUN}"
            RUN_MIGRATIONS="${INPUT_RUN_MIGRATIONS}"
          fi

          [[ "${SERVICE}" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid service" >&2; exit 1; }
          [[ "${ENVIRONMENT}" =~ ^(beta|prd)$ ]] || { echo "Invalid environment" >&2; exit 1; }
          [[ "${IMAGE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          [[ "${DRY_RUN}" =~ ^(true|false)$ ]] || { echo "Invalid dry_run value" >&2; exit 1; }

          {
            echo "service=${SERVICE}"
            echo "environment=${ENVIRONMENT}"
            echo "image_tag=${IMAGE_TAG}"
            echo "dry_run=${DRY_RUN}"
            echo "run_migrations=${RUN_MIGRATIONS}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-1

      - name: Verify image exists in ECR
        env:
          SERVICE: ${{ steps.inputs.outputs.service }}
          IMAGE_TAG: ${{ steps.inputs.outputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name "portfolio-${SERVICE}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query "imageDetails[0].imageDigest" \
            --output text

      - name: Get EC2 instance ID
        id: ec2
        env:
          ENVIRONMENT: ${{ steps.inputs.outputs.environment }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=portfolio-${ENVIRONMENT}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          [ "${INSTANCE_ID}" = "None" ] && INSTANCE_ID=""
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Inject secrets and deploy via SSM
        if: steps.ec2.outputs.instance_id != '' && steps.inputs.outputs.dry_run == 'false'
        env:
          SERVICE: ${{ steps.inputs.outputs.service }}
          IMAGE_TAG: ${{ steps.inputs.outputs.image_tag }}
          ENVIRONMENT: ${{ steps.inputs.outputs.environment }}
          RUN_MIGRATIONS: ${{ steps.inputs.outputs.run_migrations }}
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          ENV_VAR=$(echo "${SERVICE^^}_TAG" | tr '-' '_')
          SECRETS_FILE="./orchestration/services/${SERVICE}/secrets/${ENVIRONMENT}.yml"

          INJECT_COMMANDS=""
          if [ -f "${SECRETS_FILE}" ]; then
            while IFS=': ' read -r env_var ssm_path; do
              [ -z "${env_var}" ] && continue
              INJECT_COMMANDS="${INJECT_COMMANDS},'VALUE=\$(aws ssm get-parameter --name ${ssm_path} --with-decryption --query Parameter.Value --output text) && sed -i \"s|^${env_var}=.*|${env_var}=\$VALUE|\" .env || echo \"${env_var}=\$VALUE\" >> .env'"
            done < "${SECRETS_FILE}"
          fi

          COMMANDS="[
            'cd /home/deploy/app/orchestration',
            'grep -q \"^${ENV_VAR}=\" .env && sed -i \"s|^${ENV_VAR}=.*|${ENV_VAR}=${IMAGE_TAG}|\" .env || echo \"${ENV_VAR}=${IMAGE_TAG}\" >> .env'
            ${INJECT_COMMANDS},
            'docker compose pull ${SERVICE}'"

          if [ "${RUN_MIGRATIONS}" = "true" ]; then
            COMMANDS="${COMMANDS},'docker compose run --rm ${SERVICE} python manage.py migrate'"
          fi

          COMMANDS="${COMMANDS},'docker compose up -d ${SERVICE}']"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="${COMMANDS}" \
            --comment "Deploy ${SERVICE}:${IMAGE_TAG} to ${ENVIRONMENT}" \
            --query "Command.CommandId" \
            --output text)

          STATUS="Pending"
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac
            sleep 5
          done
          [ "${STATUS}" = "Success" ] || { echo "Timed out waiting for command" >&2; exit 1; }

      - name: No running instance
        if: steps.ec2.outputs.instance_id == '' && steps.inputs.outputs.dry_run == 'false'
        run: echo "::warning::No running EC2 found. The tag is recorded in SSM and applied on the next instance creation; a stopped instance keeps its old .env until the next deploy."

      - name: No running instance during dry run
        if: steps.ec2.outputs.instance_id == '' && steps.inputs.outputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run: no running EC2 found; no deployment or SSM update was performed."

      - name: Record deployed tag in SSM
        if: steps.inputs.outputs.dry_run == 'false'
        env:
          SERVICE: ${{ steps.inputs.outputs.service }}
          IMAGE_TAG: ${{ steps.inputs.outputs.image_tag }}
          ENVIRONMENT: ${{ steps.inputs.outputs.environment }}
        run: |
          aws ssm put-parameter \
            --name "/portfolio/${ENVIRONMENT}/deploy/${SERVICE}" \
            --type String \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Summary
        env:
          SERVICE: ${{ steps.inputs.outputs.service }}
          ENVIRONMENT: ${{ steps.inputs.outputs.environment }}
          IMAGE_TAG: ${{ steps.inputs.outputs.image_tag }}
          DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
          RUN_MIGRATIONS: ${{ steps.inputs.outputs.run_migrations }}
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          {
            echo "### Deploy service"
            echo "- service: \`${SERVICE}\`"
            echo "- environment: \`${ENVIRONMENT}\`"
            echo "- image tag: \`${IMAGE_TAG}\`"
            echo "- instance: \`${INSTANCE_ID:-none}\`"
            echo "- run migrations: \`${RUN_MIGRATIONS}\`"
            echo "- dry run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"