name: Deploy service

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Comma-separated service names (empty = all deployable services)"
        type: string
        required: false
      to_environment:
        description: "Target environment"
        type: choice
        options: [beta, prd]
        required: true
      from_environment:
        description: "Copy the deployed image tag from this environment"
        type: string
        required: false
      image_tag:
        description: "Image tag to deploy (e.g. main-abc1234)"
        type: string
        required: false
      dry_run:
        description: "Dry run"
        type: boolean
        default: true
      run_migrations:
        description: "Run database migrations before starting the container"
        type: boolean
        default: false
  repository_dispatch:
    types: [deploy-service]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.inputs.outputs.services }}
      to_environment: ${{ steps.inputs.outputs.to_environment }}
      from_environment: ${{ steps.inputs.outputs.from_environment }}
      image_tag: ${{ steps.inputs.outputs.image_tag }}
      dry_run: ${{ steps.inputs.outputs.dry_run }}
      run_migrations: ${{ steps.inputs.outputs.run_migrations }}
    steps:
      - name: Checkout portfolio-infra
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install --quiet PyYAML

      - name: Resolve and validate inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ github.event.client_payload.service }}
          DISPATCH_TO_ENVIRONMENT: ${{ github.event.client_payload.to_environment }}
          DISPATCH_FROM_ENVIRONMENT: ${{ github.event.client_payload.from_environment }}
          DISPATCH_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          DISPATCH_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          DISPATCH_RUN_MIGRATIONS: ${{ github.event.client_payload.run_migrations }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_TO_ENVIRONMENT: ${{ inputs.to_environment }}
          INPUT_FROM_ENVIRONMENT: ${{ inputs.from_environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            SERVICE="${DISPATCH_SERVICE}"
            TO_ENVIRONMENT="${DISPATCH_TO_ENVIRONMENT}"
            FROM_ENVIRONMENT="${DISPATCH_FROM_ENVIRONMENT}"
            IMAGE_TAG="${DISPATCH_IMAGE_TAG}"
            DRY_RUN="${DISPATCH_DRY_RUN:-false}"
            RUN_MIGRATIONS="${DISPATCH_RUN_MIGRATIONS:-false}"
          else
            SERVICE="${INPUT_SERVICE}"
            TO_ENVIRONMENT="${INPUT_TO_ENVIRONMENT}"
            FROM_ENVIRONMENT="${INPUT_FROM_ENVIRONMENT}"
            IMAGE_TAG="${INPUT_IMAGE_TAG}"
            DRY_RUN="${INPUT_DRY_RUN}"
            RUN_MIGRATIONS="${INPUT_RUN_MIGRATIONS}"
          fi

          [[ "${TO_ENVIRONMENT}" =~ ^(beta|prd)$ ]] || { echo "Invalid to_environment" >&2; exit 1; }
          [[ -z "${FROM_ENVIRONMENT}" || "${FROM_ENVIRONMENT}" =~ ^(beta|prd)$ ]] || { echo "Invalid from_environment" >&2; exit 1; }
          [[ -z "${IMAGE_TAG}" || "${IMAGE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          if [ -n "${FROM_ENVIRONMENT}" ] && [ -n "${IMAGE_TAG}" ]; then
            echo "Specify either from_environment or image_tag, not both" >&2
            exit 1
          fi
          if [ -z "${FROM_ENVIRONMENT}" ] && [ -z "${IMAGE_TAG}" ]; then
            echo "Specify from_environment or image_tag" >&2
            exit 1
          fi
          [[ "${DRY_RUN}" =~ ^(true|false)$ ]] || { echo "Invalid dry_run value" >&2; exit 1; }
          [[ "${RUN_MIGRATIONS}" =~ ^(true|false)$ ]] || { echo "Invalid run_migrations value" >&2; exit 1; }

          SERVICES=$(SERVICE_INPUT="${SERVICE}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          import yaml

          available = []
          for config_file in sorted(Path("orchestration/services").glob("*/config.yml")):
              with config_file.open(encoding="utf-8") as source:
                  config = yaml.safe_load(source) or {}
              repository_info = config.get("repository-info", {})
              if repository_info.get("deployable") is True:
                  available.append(config_file.parent.name)
          service_input = os.environ["SERVICE_INPUT"]
          selected = available if not service_input else [name.strip() for name in service_input.split(",")]
          if any(not name for name in selected):
              sys.exit("Service list contains an empty name")
          duplicates = sorted({name for name in selected if selected.count(name) > 1})
          if duplicates:
              sys.exit("Duplicate services: " + ", ".join(duplicates))
          invalid = [name for name in selected if name not in available]
          if invalid:
              sys.exit("Unknown or non-deployable service: " + ", ".join(invalid))
          print(json.dumps(selected))
          PY
          )

          {
            echo "services=${SERVICES}"
            echo "to_environment=${TO_ENVIRONMENT}"
            echo "from_environment=${FROM_ENVIRONMENT}"
            echo "image_tag=${IMAGE_TAG}"
            echo "dry_run=${DRY_RUN}"
            echo "run_migrations=${RUN_MIGRATIONS}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - name: Checkout portfolio-infra
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-1

      - name: Resolve image tag
        id: tag
        env:
          SERVICE: ${{ matrix.service }}
          FROM_ENVIRONMENT: ${{ needs.prepare.outputs.from_environment }}
          INPUT_IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          TAG="${INPUT_IMAGE_TAG}"
          if [ -n "${FROM_ENVIRONMENT}" ]; then
            TAG=$(aws ssm get-parameter \
              --name "/portfolio/${FROM_ENVIRONMENT}/deploy/${SERVICE}" \
              --query Parameter.Value \
              --output text)
          fi
          [ -n "${TAG}" ] || { echo "No image tag found for ${SERVICE}" >&2; exit 1; }
          [[ "${TAG}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify image exists in ECR
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name "portfolio-${SERVICE}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query "imageDetails[0].imageDigest" \
            --output text

      - name: Get EC2 instance ID
        id: ec2
        env:
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=portfolio-${TO_ENVIRONMENT}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          [ "${INSTANCE_ID}" = "None" ] && INSTANCE_ID=""
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy service via SSM
        if: steps.ec2.outputs.instance_id != '' && needs.prepare.outputs.dry_run == 'false'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          RUN_MIGRATIONS: ${{ needs.prepare.outputs.run_migrations }}
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          COMMANDS=$(SERVICE="${SERVICE}" TO_ENVIRONMENT="${TO_ENVIRONMENT}" IMAGE_TAG="${IMAGE_TAG}" RUN_MIGRATIONS="${RUN_MIGRATIONS}" python3 - <<'PY'
          import json
          import os

          service = os.environ["SERVICE"]
          env = os.environ["TO_ENVIRONMENT"]
          tag = os.environ["IMAGE_TAG"]
          migrate = os.environ["RUN_MIGRATIONS"]
          root = "/home/deploy/app/orchestration"
          deploy = f'''set -e
          cd {root}
          override=$(sudo -u deploy mktemp)
          trap 'rm -f "$override"' EXIT
          set -- -f {root}/docker-compose.yml
          for file in {root}/services/*/compose.yml; do
            [ -f "$file" ] || continue
            set -- "$@" -f "$file"
          done
          sudo -u deploy python3 {root}/scripts/helpers/deploy_service.py {service} {env} {tag} {migrate} "$override"
          sudo -u deploy docker compose "$@" -f "$override" pull {service}
          sudo -u deploy docker compose "$@" -f "$override" up -d --no-deps {service}'''
          print(json.dumps({"commands": [
              "sudo -u deploy git -C /home/deploy/app pull --ff-only origin main",
              deploy,
          ]}))
          PY
          )
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${COMMANDS}" \
            --comment "Deploy ${SERVICE}:${IMAGE_TAG} to ${TO_ENVIRONMENT}" \
            --query "Command.CommandId" \
            --output text)

          STATUS="Pending"
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac
            sleep 5
          done
          [ "${STATUS}" = "Success" ] || { echo "Timed out waiting for command" >&2; exit 1; }

      - name: No running instance
        if: steps.ec2.outputs.instance_id == '' && needs.prepare.outputs.dry_run == 'false'
        run: echo "::warning::No running EC2 found. The tag is recorded in SSM and applied on the next instance creation; a stopped instance keeps its old .env until the next deploy."

      - name: No running instance during dry run
        if: steps.ec2.outputs.instance_id == '' && needs.prepare.outputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run: no running EC2 found; no deployment or SSM update was performed."

      - name: Record deployed tag in SSM
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
        run: |
          aws ssm put-parameter \
            --name "/portfolio/${TO_ENVIRONMENT}/deploy/${SERVICE}" \
            --type String \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Summary
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          FROM_ENVIRONMENT: ${{ needs.prepare.outputs.from_environment }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RUN_MIGRATIONS: ${{ needs.prepare.outputs.run_migrations }}
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          {
            echo "### Deploy service"
            echo "- service: \`${SERVICE}\`"
            echo "- target environment: \`${TO_ENVIRONMENT}\`"
            [ -z "${FROM_ENVIRONMENT}" ] || echo "- source environment: \`${FROM_ENVIRONMENT}\`"
            echo "- image tag: \`${IMAGE_TAG}\`"
            echo "- instance: \`${INSTANCE_ID:-none}\`"
            echo "- run migrations: \`${RUN_MIGRATIONS}\`"
            echo "- dry run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
