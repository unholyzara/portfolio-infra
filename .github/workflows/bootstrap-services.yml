name: Bootstrap services

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        type: boolean
        default: true
        required: true

jobs:
  plan:
    name: Terraform plan (bootstrap)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: terraform/stacks/global/
        run: terraform init -backend-config="key=global/terraform.tfstate"

      - name: Terraform validate
        working-directory: terraform/stacks/global/
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/stacks/global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TF_VAR_github_token: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          terraform plan -out=tfplan \
            -var-file=../vars/common.tfvars

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-terraform-plan
          path: terraform/stacks/global/tfplan
          if-no-files-found: error
          retention-days: 1

  approve:
    name: Approve bootstrap plan
    needs: [plan]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Approval gate
        run: echo "Bootstrap Terraform plan approved"

  apply:
    name: Terraform apply (bootstrap)
    needs: [approve]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: terraform/stacks/global/
        run: terraform init -backend-config="key=global/terraform.tfstate"

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-terraform-plan
          path: terraform/stacks/global

      - name: Terraform apply
        working-directory: terraform/stacks/global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TF_VAR_github_token: ${{ secrets.GH_ADMIN_TOKEN }}
        run: terraform apply tfplan
