name: Bootstrap services

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-services-apply
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform bootstrap plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: eu-south-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: global/
        run: terraform init

      - name: Terraform validate
        working-directory: global/
        run: terraform validate

      - name: Terraform plan
        working-directory: global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-services-tfplan
          path: global/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform bootstrap apply
    needs: plan
    runs-on: ubuntu-latest
    environment: bootstrap-services-apply
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: eu-south-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: global/
        run: terraform init

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-services-tfplan
          path: global/

      - name: Terraform apply
        working-directory: global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: terraform apply tfplan
