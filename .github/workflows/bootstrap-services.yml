name: Bootstrap services

on:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: eu-south-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: global/
        run: terraform init

      - name: Terraform validate
        working-directory: global/
        run: terraform validate

      - name: Terraform plan
        working-directory: global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: terraform plan -out=tfplan

      - name: Wait for approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GH_ADMIN_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Terraform Apply approval"
          issue-body: |
            Terraform plan completato.

            Approva questa richiesta per eseguire terraform apply.
            Se non viene approvata, il workflow terminerà automaticamente.

          exclude-workflow-initiator-as-approver: false

      - name: Terraform apply
        working-directory: global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: terraform apply tfplan