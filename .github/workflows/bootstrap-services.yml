name: Bootstrap services

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after reviewing the plan"
        type: boolean
        default: false
        required: true

jobs:
  terraform:
    name: Terraform bootstrap
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: terraform/stacks/global/
        run: terraform init -backend-config="key=global/terraform.tfstate"

      - name: Terraform validate
        working-directory: terraform/stacks/global/
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/stacks/global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          terraform plan -out=tfplan \
            -var-file=../common.tfvars \
            -var-file="vars/common.tfvars"

      - name: Terraform apply
        if: inputs.apply
        working-directory: terraform/stacks/global/
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: terraform apply tfplan
