name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [beta, prd]
        default: beta
        required: true

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ENVIRONMENT: ${{ inputs.environment }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_github_token: ${{ secrets.GH_ADMIN_TOKEN }}

jobs:
  plan-infrastructure:
    name: Plan infrastructure (${{ inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        run: terraform init -backend-config="key=infrastructure/${ENVIRONMENT}/terraform.tfstate"

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan \
            -var-file="../vars/common.tfvars" \
            -var-file="../vars/${ENVIRONMENT}.tfvars" \
            -var-file="vars/common.tfvars" \
            -var-file="vars/${ENVIRONMENT}.tfvars"

      - name: Upload infrastructure plan
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-plan-${{ inputs.environment }}
          path: terraform/stacks/infrastructure/tfplan
          if-no-files-found: error
          retention-days: 1

  plan-persistent:
    name: Plan Persistent (${{ inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/persistent
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        run: terraform init -backend-config="key=persistent/${ENVIRONMENT}/terraform.tfstate"

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan \
            -var-file="../vars/common.tfvars" \
            -var-file="../vars/${ENVIRONMENT}.tfvars" \
            -var-file="vars/common.tfvars" \
            -var-file="vars/${ENVIRONMENT}.tfvars"

      - name: Upload Persistent plan
        uses: actions/upload-artifact@v4
        with:
          name: persistent-plan-${{ inputs.environment }}
          path: terraform/stacks/persistent/tfplan
          if-no-files-found: error
          retention-days: 1

  approve-plans:
    name: Approve Terraform plans
    needs: [plan-infrastructure, plan-persistent]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Approval gate
        run: echo "Terraform plans approved for ${ENVIRONMENT}"

  apply-infrastructure:
    name: Apply infrastructure (${{ inputs.environment }})
    needs: [approve-plans]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    defaults:
      run:
        working-directory: terraform/stacks/infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        run: terraform init -backend-config="key=infrastructure/${ENVIRONMENT}/terraform.tfstate"

      - name: Download infrastructure plan
        uses: actions/download-artifact@v4
        with:
          name: infrastructure-plan-${{ inputs.environment }}
          path: terraform/stacks/infrastructure

      - name: Terraform apply
        run: terraform apply tfplan

  apply-persistent:
    name: Apply Persistent (${{ inputs.environment }})
    needs: [approve-plans]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/persistent
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        run: terraform init -backend-config="key=persistent/${ENVIRONMENT}/terraform.tfstate"

      - name: Download Persistent plan
        uses: actions/download-artifact@v4
        with:
          name: persistent-plan-${{ inputs.environment }}
          path: terraform/stacks/persistent

      - name: Terraform apply
        run: terraform apply tfplan
  
  ensure-cert:
    name: Ensure TLS certificate (${{ inputs.environment }})
    needs: [apply-infrastructure, apply-persistent]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend-config="key=infrastructure/${ENVIRONMENT}/terraform.tfstate"

      - name: Run certs.sh on the instance
        env:
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CERT_BUCKET: ${{ vars.CERT_BUCKET }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail

          INSTANCE_ID="$(terraform output -raw instance_id)"

          if [[ "${ENVIRONMENT}" == "prd" ]]; then
            DOMAIN="${ROOT_DOMAIN}"
            IS_PRD="true"
          else
            DOMAIN="${ENVIRONMENT}.${ROOT_DOMAIN}"
            IS_PRD="false"
          fi

          SCRIPT_B64="$(gzip -9c "${GITHUB_WORKSPACE}/orchestration/scripts/certs.sh" | base64 -w0)"

          PARAMETERS="$(jq -n \
            --arg b64 "${SCRIPT_B64}" \
            --arg domain "${DOMAIN}" \
            --arg env "${ENVIRONMENT}" \
            --arg bucket "${CERT_BUCKET}" \
            --arg email "${LETSENCRYPT_EMAIL}" \
            --arg region "${AWS_REGION}" \
            --arg prd "${IS_PRD}" \
            '{commands: ([
              "set -euo pipefail",
              "install -d /opt/portfolio/orchestration/scripts",
              "echo \($b64) | base64 -d | gunzip > /opt/portfolio/orchestration/scripts/certs.sh",
              "chmod +x /opt/portfolio/orchestration/scripts/certs.sh",
              "export DOMAIN=\($domain) ENVIRONMENT=\($env) CERT_BUCKET=\($bucket) LETSENCRYPT_EMAIL=\($email) AWS_REGION=\($region)",
              "/opt/portfolio/orchestration/scripts/certs.sh ensure"
            ] + (if $prd == "true" then ["/opt/portfolio/orchestration/scripts/certs.sh install-timer"] else [] end))}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "${PARAMETERS}" \
            --query Command.CommandId \
            --output text)"

          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent \
            --output text

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query StandardErrorContent \
            --output text

          test "${STATUS}" = "Success"
