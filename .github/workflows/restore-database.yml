name: Restore database

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to restore into"
        type: choice
        options: [beta, prd]
        required: true
      source_environment:
        description: "Environment whose backup is restored (same = target)"
        type: choice
        options: [same, beta, prd]
        default: same
        required: true
      backup_date:
        description: "Backup date (YYYY-MM-DD, UTC). Empty = latest backup"
        type: string
        default: ""
      dry_run:
        description: "Dry run"
        type: boolean
        default: true

concurrency:
  group: db-restore-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: Plan restore
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      source: ${{ steps.resolve.outputs.source }}
      key: ${{ steps.resolve.outputs.key }}
      instance_id: ${{ steps.resolve.outputs.instance_id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve backup and target instance
        id: resolve
        env:
          TARGET: ${{ inputs.target_environment }}
          SOURCE_INPUT: ${{ inputs.source_environment }}
          BACKUP_DATE: ${{ inputs.backup_date }}
        run: |
          SOURCE="${SOURCE_INPUT}"
          [ "${SOURCE}" != "same" ] || SOURCE="${TARGET}"
          [[ "${TARGET}" =~ ^(beta|prd)$ && "${SOURCE}" =~ ^(beta|prd)$ ]] || { echo "Invalid environment" >&2; exit 1; }
          [[ -z "${BACKUP_DATE}" || "${BACKUP_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "backup_date must be YYYY-MM-DD" >&2; exit 1; }

          BUCKET="portfolio-${SOURCE}-backup-s3"
          if [ -z "${BACKUP_DATE}" ]; then
            KEY="latest.sql.gz"
          else
            DAY="${BACKUP_DATE//-/}"
            KEY=$(aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "api_db-${DAY}T" --output json \
              | jq -r '.Contents // [] | map(.Key) | sort | last // empty')
            if [ -z "${KEY}" ]; then
              echo "No backup for ${BACKUP_DATE} in ${BUCKET}. Available dates:" >&2
              aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "api_db-" --output json \
                | jq -r '.Contents // [] | map(.Key[7:15]) | unique | .[]' >&2
              exit 1
            fi
          fi

          read -r SIZE MODIFIED < <(aws s3api head-object --bucket "${BUCKET}" --key "${KEY}" \
            --query '[ContentLength, LastModified]' --output text)

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=portfolio-${TARGET}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          { [ -n "${INSTANCE_ID}" ] && [ "${INSTANCE_ID}" != "None" ]; } || {
            echo "No running EC2 instance for ${TARGET}" >&2
            exit 1
          }

          {
            echo "target=${TARGET}"
            echo "source=${SOURCE}"
            echo "key=${KEY}"
            echo "instance_id=${INSTANCE_ID}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Restore plan"
            echo "- source: \`s3://${BUCKET}/${KEY}\` (${SIZE} bytes, last modified ${MODIFIED})"
            echo "- target: \`${TARGET}\` (instance \`${INSTANCE_ID}\`)"
            if [ "${SOURCE}" != "${TARGET}" ]; then
              echo "- UUIDs are regenerated (different environments)"
            else
              echo "- UUIDs are preserved"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve restore
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Approval gate
        run: echo "Restore approved for ${{ inputs.target_environment }}"

  restore:
    name: Restore ${{ inputs.dry_run && '(dry run)' || '' }}
    needs: [plan, approve]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stage backup in the target bucket
        id: stage
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          SOURCE: ${{ needs.plan.outputs.source }}
          KEY: ${{ needs.plan.outputs.key }}
        run: |
          if [ "${SOURCE}" = "${TARGET}" ]; then
            RESTORE_KEY="${KEY}"
          else
            RESTORE_KEY="imports/${SOURCE}-${KEY}"
            aws s3 cp "s3://portfolio-${SOURCE}-backup-s3/${KEY}" "s3://portfolio-${TARGET}-backup-s3/${RESTORE_KEY}" --only-show-errors
          fi
          echo "restore_key=${RESTORE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore via SSM
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          SOURCE: ${{ needs.plan.outputs.source }}
          INSTANCE_ID: ${{ needs.plan.outputs.instance_id }}
          RESTORE_KEY: ${{ steps.stage.outputs.restore_key }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "${RESTORE_KEY}" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid key" >&2; exit 1; }

          FLAGS=""
          [ "${SOURCE}" = "${TARGET}" ] || FLAGS="${FLAGS} --regenerate-uuids"
          [ "${DRY_RUN}" != "true" ] || FLAGS="${FLAGS} --dry-run"

          PARAMETERS=$(jq -n \
            --arg cmd "sudo -u deploy bash /home/deploy/app/orchestration/scripts/db-restore.sh --key ${RESTORE_KEY}${FLAGS}" \
            '{commands: ["set -e", "sudo -u deploy git -C /home/deploy/app pull --ff-only origin main", $cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMETERS}" \
            --comment "Restore database ${TARGET} from ${SOURCE}" \
            --query "Command.CommandId" \
            --output text)

          STATUS="Pending"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text)
          ERRORS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text)

          {
            echo "### Restore result (${STATUS})"
            echo '```'
            echo "${OUTPUT}"
            [ -z "${ERRORS}" ] || echo "${ERRORS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "${OUTPUT}"
          [ -z "${ERRORS}" ] || echo "${ERRORS}" >&2
          [ "${STATUS}" = "Success" ] || { echo "Restore failed (${STATUS})" >&2; exit 1; }
