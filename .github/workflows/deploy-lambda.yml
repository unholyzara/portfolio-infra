name: Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Comma-separated Lambda service names (empty = all Lambda services)"
        type: string
        required: false
      to_environment:
        description: "Target environment"
        type: choice
        options: [beta, prd]
        required: true
      from_environment:
        description: "Copy the deployed image tag from this environment"
        type: string
        required: false
      image_tag:
        description: "Image tag to deploy (empty = latest tagged ECR image)"
        type: string
        required: false
      dry_run:
        description: "Dry run"
        type: boolean
        default: true

env:
  AWS_REGION: eu-south-1
  # Keep aligned with the other Terraform workflows
  TF_VERSION: "~1.15"
  STACK_DIR: terraform/stacks/lambdas
  COMMON_VARS: terraform/environments/common.tfvars
  ENV_VARS_DIR: terraform/environments

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.inputs.outputs.services }}
      to_environment: ${{ steps.inputs.outputs.to_environment }}
      from_environment: ${{ steps.inputs.outputs.from_environment }}
      image_tag: ${{ steps.inputs.outputs.image_tag }}
      dry_run: ${{ steps.inputs.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate inputs
        id: inputs
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_TO_ENVIRONMENT: ${{ inputs.to_environment }}
          INPUT_FROM_ENVIRONMENT: ${{ inputs.from_environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "${INPUT_TO_ENVIRONMENT}" =~ ^(beta|prd)$ ]] || { echo "Invalid to_environment" >&2; exit 1; }
          [[ -z "${INPUT_FROM_ENVIRONMENT}" || "${INPUT_FROM_ENVIRONMENT}" =~ ^(beta|prd)$ ]] || { echo "Invalid from_environment" >&2; exit 1; }
          [[ -z "${INPUT_IMAGE_TAG}" || "${INPUT_IMAGE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          if [ -n "${INPUT_FROM_ENVIRONMENT}" ] && [ -n "${INPUT_IMAGE_TAG}" ]; then
            echo "Specify either from_environment or image_tag, not both" >&2
            exit 1
          fi
          [[ "${INPUT_DRY_RUN}" =~ ^(true|false)$ ]] || { echo "Invalid dry_run value" >&2; exit 1; }

          SERVICES=$(SERVICE_INPUT="${INPUT_SERVICE}" ruby -rjson -ryaml -e '
            available = Dir.glob("services/*/config.yml").sort.filter_map do |path|
              config = YAML.safe_load_file(path)
              File.basename(File.dirname(path)) if config.is_a?(Hash) && config["lambda"] == true
            end
            input = ENV.fetch("SERVICE_INPUT")
            selected = input.empty? ? available : input.split(",", -1).map(&:strip)
            abort "Lambda service list contains an empty name" if selected.any?(&:empty?)
            duplicates = selected.select { |name| selected.count(name) > 1 }.uniq
            abort "Duplicate Lambda services: #{duplicates.join(", ")}" unless duplicates.empty?
            invalid = selected - available
            abort "Unknown Lambda service: #{invalid.join(", ")}" unless invalid.empty?
            puts JSON.generate(selected)
          ')

          {
            echo "services=${SERVICES}"
            echo "to_environment=${INPUT_TO_ENVIRONMENT}"
            echo "from_environment=${INPUT_FROM_ENVIRONMENT}"
            echo "image_tag=${INPUT_IMAGE_TAG}"
            echo "dry_run=${INPUT_DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

  plan:
    name: Plan ${{ matrix.service }} (${{ needs.prepare.outputs.to_environment }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-lambda-${{ matrix.service }}-${{ needs.prepare.outputs.to_environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          FROM_ENVIRONMENT: ${{ needs.prepare.outputs.from_environment }}
          INPUT_IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          TAG="${INPUT_IMAGE_TAG}"
          if [ -n "${FROM_ENVIRONMENT}" ]; then
            TAG=$(aws ssm get-parameter \
              --name "/portfolio/${FROM_ENVIRONMENT}/deploy/${SERVICE}" \
              --query Parameter.Value \
              --output text)
          elif [ -z "${TAG}" ]; then
            TAG=$(aws ecr describe-images \
              --repository-name "portfolio-${SERVICE}-lmb" \
              --filter tagStatus=TAGGED \
              --query "sort_by(imageDetails, &imagePushedAt)[-1].imageTags[0]" \
              --output text)
          fi
          [ -n "${TAG}" ] && [ "${TAG}" != "None" ] || {
            echo "No tagged ECR image found for ${SERVICE}" >&2
            exit 1
          }
          [[ "${TAG}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify image exists in ECR
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name "portfolio-${SERVICE}-lmb" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query "imageDetails[0].imageDigest" \
            --output text

      - name: Read current image tag
        id: old-tag
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
        run: |
          OLD_TAG=$(aws ssm get-parameter \
            --name "/portfolio/${TO_ENVIRONMENT}/deploy/${SERVICE}" \
            --query Parameter.Value \
            --output text 2>/dev/null || true)
          [ "${OLD_TAG}" != "None" ] || OLD_TAG=""
          echo "image_tag=${OLD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.STACK_DIR }}
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=lambdas/${SERVICE}/${TO_ENVIRONMENT}.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        working-directory: ${{ env.STACK_DIR }}
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          ROOT="${GITHUB_WORKSPACE}"
          VAR_FILES=()
          for f in "${ROOT}/${COMMON_VARS}" "${ROOT}/${ENV_VARS_DIR}/${TO_ENVIRONMENT}.tfvars"; do
            [ -f "$f" ] && VAR_FILES+=("-var-file=$f")
          done

          terraform plan -input=false -out=tfplan \
            "${VAR_FILES[@]}" \
            -var "environment=${TO_ENVIRONMENT}" \
            -var "service=${SERVICE}" \
            -var "image_tag=${IMAGE_TAG}"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: lambda-plan-${{ needs.prepare.outputs.to_environment }}-${{ matrix.service }}
          path: ${{ env.STACK_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

      - name: Build image tag report row
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          OLD_IMAGE_TAG: ${{ steps.old-tag.outputs.image_tag }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          mkdir -p reports
          OLD_TAG="${OLD_IMAGE_TAG:-unset}"
          printf '| %s | `%s` -> `%s` |\n' "${SERVICE}" "${OLD_TAG}" "${IMAGE_TAG}" > "reports/${SERVICE}.md"

      - name: Upload image tag report row
        uses: actions/upload-artifact@v4
        with:
          name: lambda-report-${{ needs.prepare.outputs.to_environment }}-${{ matrix.service }}
          path: reports/${{ matrix.service }}.md
          if-no-files-found: error
          retention-days: 7

  report:
    name: Lambda image tag report
    needs: [prepare, plan]
    runs-on: ubuntu-latest
    steps:
      - name: Download image tag report rows
        uses: actions/download-artifact@v4
        with:
          pattern: lambda-report-${{ needs.prepare.outputs.to_environment }}-*
          path: report-rows
          merge-multiple: true

      - name: Build image tag report
        run: |
          {
            echo "# Lambda image tag changes"
            echo
            echo "| Lambda | Image tag |"
            echo "| --- | --- |"
            cat report-rows/*.md
          } > deployment-report.md

      - name: Upload image tag report
        uses: actions/upload-artifact@v4
        with:
          name: lambda-image-tags-${{ needs.prepare.outputs.to_environment }}
          path: deployment-report.md
          if-no-files-found: error
          retention-days: 7

  approve:
    name: Approve production deploy
    needs: [prepare, plan]
    if: needs.prepare.outputs.to_environment == 'prd' && needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.to_environment }}
    steps:
      - name: Approval gate
        run: echo "Production deploy approved"

  apply:
    name: Apply ${{ matrix.service }} (${{ needs.prepare.outputs.to_environment }})
    needs: [prepare, plan, approve]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.plan.result == 'success' &&
      needs.prepare.outputs.dry_run == 'false' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-lambda-${{ matrix.service }}-${{ needs.prepare.outputs.to_environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.STACK_DIR }}
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=lambdas/${SERVICE}/${TO_ENVIRONMENT}.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: lambda-plan-${{ needs.prepare.outputs.to_environment }}-${{ matrix.service }}
          path: ${{ env.STACK_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.STACK_DIR }}
        run: terraform apply -input=false tfplan

      - name: Summary
        env:
          SERVICE: ${{ matrix.service }}
          TO_ENVIRONMENT: ${{ needs.prepare.outputs.to_environment }}
          FROM_ENVIRONMENT: ${{ needs.prepare.outputs.from_environment }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          {
            echo "### Deploy Lambda"
            echo "- service: \`${SERVICE}\`"
            echo "- target environment: \`${TO_ENVIRONMENT}\`"
            [ -z "${FROM_ENVIRONMENT}" ] || echo "- source environment: \`${FROM_ENVIRONMENT}\`"
            echo "- dry run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
