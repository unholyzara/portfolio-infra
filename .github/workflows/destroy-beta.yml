name: Destroy beta environment

on:
  workflow_dispatch:
  repository_dispatch:
    types: [autodestroy-beta]

concurrency:
  group: terraform-beta
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform destroy beta
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform/stacks/infrastructure

    env:
      ENVIRONMENT: beta
      AWS_REGION: ${{ env.AWS_REGION }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_ecr_registry: ${{ vars.ECR_REGISTRY }}
      TF_VAR_github_token: ${{ secrets.GH_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        run: terraform init -backend-config="key=infrastructure/${ENVIRONMENT}/terraform.tfstate"

      - name: Terraform destroy
        run: |
          terraform destroy -auto-approve \
            -var-file=../common.tfvars \
            -var-file="vars/${ENVIRONMENT}.tfvars"