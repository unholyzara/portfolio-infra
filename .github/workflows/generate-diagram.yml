name: Architecture diagram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        type: boolean
        default: false

# Permessi minimi di default; i job che servono di più li dichiarano da soli.
permissions:
  contents: read

concurrency:
  group: architecture-diagram
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_DIR: terraform/stacks/infrastructure
  COMPOSE_FILE: orchestration/docker-compose.yml
  DOMAIN: DOMINIO
  SCRIPTS: .github/scripts/generate-diagram
  OUT: orchestration/scripts/architecture/output
  FINAL_DIR: orchestration/diagram
  FINAL: orchestration/diagram/architecture.json

jobs:

  # --------------------------------
  # 1. Terraform + parser (stesso job: il plan non esce mai dal runner)
  # --------------------------------
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan, graph, show
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="key=infrastructure/prd/terraform.tfstate"

          terraform plan \
            -input=false \
            -out=tfplan \
            -var-file=../vars/common.tfvars \
            -var-file=../vars/prd.tfvars \
            -var-file="vars/common.tfvars" \
            -var-file="vars/prd.tfvars"

          terraform graph -plan=tfplan > terraform.dot
          terraform show -json tfplan > terraform-plan.json

      - name: Build infrastructure.json
        run: |
          mkdir -p "$OUT"

          python "$SCRIPTS/terraform_parser.py" \
            --plan "$TF_DIR/terraform-plan.json" \
            --graph "$TF_DIR/terraform.dot" \
            --output "$OUT/infrastructure.json"

      # Solo infrastructure.json: tfplan e terraform-plan.json possono contenere
      # valori sensibili e non devono diventare artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-output
          path: ${{ env.OUT }}/infrastructure.json
          retention-days: 1


  # --------------------------------
  # 2. Docker Compose parser
  # --------------------------------
  parse-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Build services.json
        run: |
          mkdir -p "$OUT"

          python "$SCRIPTS/compose_parser.py" \
            --compose "$COMPOSE_FILE" \
            --domain "$DOMAIN" \
            --output "$OUT/services.json"

      - uses: actions/upload-artifact@v4
        with:
          name: compose-output
          path: ${{ env.OUT }}/services.json
          retention-days: 1


  # --------------------------------
  # 3. Merge + Copilot layout
  # --------------------------------
  merge-and-layout:
    needs:
      - parse-compose
      - terraform

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: compose-output
          path: ${{ env.OUT }}

      - uses: actions/download-artifact@v4
        with:
          name: infrastructure-output
          path: ${{ env.OUT }}

      - name: Merge architecture
        run: |
          python "$SCRIPTS/architecture_merger.py" \
            --services "$OUT/services.json" \
            --infrastructure "$OUT/infrastructure.json" \
            --output "$OUT/architecture.json"

      - name: Layout with Copilot CLI and validate
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          MAX_ATTEMPTS: "3"
        run: |
          npm install -g @github/copilot

          cp "$OUT/architecture.json" "$OUT/architecture.generated.json"
          rm -f "$OUT/layout_errors.txt"

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Copilot attempt $attempt/$MAX_ATTEMPTS"

            cp "$OUT/architecture.generated.json" "$OUT/architecture.json"

            copilot --agent architecture-layout \
              -p "Lay out the architecture diagram in the TARGET file. Follow all instructions and constraints defined by the architecture-layout agent." \
              -s --allow-tool=write --no-ask-user

            if python "$SCRIPTS/validate_layout.py" \
                --generated "$OUT/architecture.generated.json" \
                --edited "$OUT/architecture.json" \
                --current "$FINAL" \
                --output "$FINAL" \
                --errors-file "$OUT/layout_errors.txt"; then
              echo "::endgroup::"
              exit 0
            fi

            echo "::endgroup::"
          done

          echo "::error::Layout non valido dopo $MAX_ATTEMPTS tentativi"
          cat "$OUT/layout_errors.txt"
          exit 1

      # Artifact con UN SOLO percorso: la radice dell'artifact è la cartella del file,
      # quindi contiene solo architecture.json (con più percorsi la radice diventa
      # l'antenato comune e il file finisce nel posto sbagliato al download).
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-final
          path: ${{ env.FINAL }}
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-debug
          path: |
            ${{ env.OUT }}/services.json
            ${{ env.OUT }}/infrastructure.json
            ${{ env.OUT }}/architecture.generated.json
          retention-days: 7


  # --------------------------------
  # 4. Publish
  # --------------------------------
  publish:
    needs: merge-and-layout
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: architecture-final
          path: ${{ env.FINAL_DIR }}

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$FINAL"

          if git diff --cached --quiet; then
            echo "Nessuna modifica a $FINAL, niente commit."
          else
            git commit -m "chore(diagram): update architecture.json"
            git push
          fi
