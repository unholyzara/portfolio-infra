
name: Test Copilot CLI

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Test Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          copilot -p "Reply with exactly: COPILOT_CONNECTION_OK" \
            --silent \
            --no-ask-user
