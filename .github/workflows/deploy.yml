name: Deploy service

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service name"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: choice
        options: [beta, prd]
        required: true
      image_tag:
        description: "Image tag to deploy (e.g. main-abc1234)"
        type: string
        required: true
      run_migrations:
        description: "Run database migrations before starting the container"
        type: boolean
        default: false
  repository_dispatch:
    types: [deploy-service]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout portfolio-infra
        uses: actions/checkout@v4

      - name: Checkout portfolio-orchestrator
        uses: actions/checkout@v4
        with:
          repository: unholyzara/portfolio-orchestrator
          path: orchestrator

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "service=${{ github.event.client_payload.service }}"                 >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.client_payload.environment }}"         >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.event.client_payload.image_tag }}"             >> $GITHUB_OUTPUT
            echo "run_migrations=${{ github.event.client_payload.run_migrations }}"   >> $GITHUB_OUTPUT
          else
            echo "service=${{ inputs.service }}"               >> $GITHUB_OUTPUT
            echo "environment=${{ inputs.environment }}"       >> $GITHUB_OUTPUT
            echo "image_tag=${{ inputs.image_tag }}"           >> $GITHUB_OUTPUT
            echo "run_migrations=${{ inputs.run_migrations }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-1

      - name: Get EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=portfolio-${{ steps.inputs.outputs.environment }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=${INSTANCE_ID}" >> $GITHUB_OUTPUT

      - name: Inject secrets and deploy via SSM
        run: |
          SERVICE="${{ steps.inputs.outputs.service }}"
          IMAGE_TAG="${{ steps.inputs.outputs.image_tag }}"
          ENVIRONMENT="${{ steps.inputs.outputs.environment }}"
          RUN_MIGRATIONS="${{ steps.inputs.outputs.run_migrations }}"
          ENV_VAR=$(echo "${SERVICE^^}_TAG" | tr '-' '_')
          SECRETS_FILE="orchestrator/secrets/${SERVICE}/${ENVIRONMENT}.yml"

          # Build inject commands from secrets yml if it exists
          INJECT_COMMANDS=""
          if [ -f "${SECRETS_FILE}" ]; then
            while IFS=': ' read -r env_var ssm_path; do
              [ -z "${env_var}" ] && continue
              INJECT_COMMANDS="${INJECT_COMMANDS},'VALUE=\$(aws ssm get-parameter --name ${ssm_path} --with-decryption --query Parameter.Value --output text) && sed -i \"s|^${env_var}=.*|${env_var}=\$VALUE|\" .env || echo \"${env_var}=\$VALUE\" >> .env'"
            done < "${SECRETS_FILE}"
          fi

          COMMANDS="[
            'cd /home/deploy/app',
            'sed -i \"s|^${ENV_VAR}=.*|${ENV_VAR}=${IMAGE_TAG}|\" .env'
            ${INJECT_COMMANDS},
            'docker compose pull ${SERVICE}'"

          if [ "${RUN_MIGRATIONS}" = "true" ]; then
            COMMANDS="${COMMANDS},'docker compose run --rm ${SERVICE} python manage.py migrate'"
          fi

          COMMANDS="${COMMANDS},'docker compose up -d ${SERVICE}']"

          aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="${COMMANDS}" \
            --comment "Deploy ${SERVICE}:${IMAGE_TAG} to ${ENVIRONMENT}" \
            --output text
