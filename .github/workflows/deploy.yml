name: Deploy service

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service name (e.g. service-b)"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: choice
        options: [beta, prd]
        required: true
      image_tag:
        description: "Image tag to deploy (e.g. main-abc1234)"
        type: string
        required: true
  repository_dispatch:
    types: [deploy-service]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "service=${{ github.event.client_payload.service }}"         >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.client_payload.environment }}" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.event.client_payload.image_tag }}"     >> $GITHUB_OUTPUT
          else
            echo "service=${{ inputs.service }}"         >> $GITHUB_OUTPUT
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "image_tag=${{ inputs.image_tag }}"     >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-1

      - name: Get EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=portfolio-${{ steps.inputs.outputs.environment }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=${INSTANCE_ID}" >> $GITHUB_OUTPUT

      - name: Deploy via SSM
        run: |
          SERVICE="${{ steps.inputs.outputs.service }}"
          IMAGE_TAG="${{ steps.inputs.outputs.image_tag }}"
          ENV_VAR=$(echo "${SERVICE^^}_TAG" | tr '-' '_')

          aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'cd /home/deploy/app',
              'sed -i \"s|^${ENV_VAR}=.*|${ENV_VAR}=${IMAGE_TAG}|\" .env',
              'docker compose pull ${SERVICE}',
              'docker compose up -d ${SERVICE}'
            ]" \
            --comment "Deploy ${SERVICE}:${IMAGE_TAG} to ${{ steps.inputs.outputs.environment }}" \
            --output text
