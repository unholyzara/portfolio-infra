services:
  frontend:
    image: ${ECR_REGISTRY}/portfolio-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-32m}
    env_file:
      - ../services/frontend/envs/${ENVIRONMENT}.env
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - api
