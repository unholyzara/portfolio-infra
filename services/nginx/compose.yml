services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../services/nginx/envs/${ENVIRONMENT}.env
    volumes:
      - ../services/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ../services/nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ../services/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./diagram:/usr/share/nginx/diagram:ro
      - /opt/portfolio/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api
      - admin
