services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./nginx/redirect.conf:/etc/nginx/redirect.conf:ro
      - ./diagram:/usr/share/nginx/diagram:ro
      - /opt/portfolio/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api
      - admin
