services:
  api:
    image: ${ECR_REGISTRY}/portfolio-api:${API_TAG}
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-256m}
    env_file:
      - ../services/api/envs/${ENVIRONMENT}.env
    environment:
      WEB_CONCURRENCY: ${API_WORKERS:-1}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0].strip()}), timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - postgres
